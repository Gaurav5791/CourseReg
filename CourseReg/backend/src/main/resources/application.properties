# === Database ===
# Update the username/password to match your local MySQL setup.
spring.datasource.url=jdbc:mysql://localhost:3306/course_registration?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# Replace 'YOUR_MYSQL_PASSWORD' with the actual password for the MySQL user
# above (or set a DB_PASSWORD environment variable). If this is wrong, every
# request that touches the database will fail with a 500 "Internal server error".
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP, bundled with Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# === Server ===
server.port=8080

# === JWT ===
# CHANGE THIS before deploying anywhere real. Must be at least 32 bytes
# for HS256. Generate one with: openssl rand -base64 32
jwt.secret=5urefwgFeg1ghpHhJFLNiOBdVU2MoYbdUxBMUzCym1UHMlvwa5xGwHEHApTSLyW1Zp0Q4QZrUCf0fUmS32tSTg==
jwt.expiration-ms=86400000

# === Logging ===
logging.level.com.courseregistration=DEBUG
