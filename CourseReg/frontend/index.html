<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registrar's Ledger</title>
<link rel="stylesheet" href="css/styles.css" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
</head>
<body>
<script src="js/nebula-bg.js"></script>

<div class="auth-wrapper">
  <!-- Animated background is the WebGL nebula canvas injected by js/nebula-bg.js -->
  <div class="auth-container glass">
    <div class="auth-left">
      <div class="auth-brand">
        <div class="brand-icon">📚</div>
        <h1>Registrar's Ledger</h1>
        <p class="brand-tagline">Modern course registration<br />reimagined for the future</p>
      </div>
      <div class="auth-features">
        <div class="feature-item">
          <span class="feature-icon">✓</span>
          <span>Real-time enrollment tracking</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">✓</span>
          <span>Intelligent course recommendations</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">✓</span>
          <span>Seamless approval workflow</span>
        </div>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Welcome back</h2>
          <p class="auth-subtitle">Sign in to access your dashboard</p>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login" onclick="switchAuthTab('login')">Sign In</button>
          <button class="auth-tab" data-tab="register" onclick="switchAuthTab('register')">Create Account</button>
        </div>

        <div id="authError" class="auth-error hidden"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Username</label>
            <div class="input-group">
              <span class="input-icon">👤</span>
              <input type="text" id="loginUsername" placeholder="Enter your username" required />
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-group">
              <span class="input-icon">🔒</span>
              <input type="password" id="loginPassword" placeholder="Enter your password" required />
            </div>
          </div>
          <button type="submit" class="btn btn-gradient btn-block">Sign In →</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>Full Name</label>
            <div class="input-group">
              <span class="input-icon">👤</span>
              <input type="text" id="regFullName" placeholder="Enter your full name" required />
            </div>
          </div>
          <div class="form-group">
            <label>Email</label>
            <div class="input-group">
              <span class="input-icon">✉️</span>
              <input type="email" id="regEmail" placeholder="Enter your email" required />
            </div>
          </div>
          <div class="form-group">
            <label>Username</label>
            <div class="input-group">
              <span class="input-icon">@</span>
              <input type="text" id="regUsername" placeholder="Choose a username" required minlength="3" />
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-group">
              <span class="input-icon">🔒</span>
              <input type="password" id="regPassword" placeholder="Create a password" required minlength="6" />
            </div>
          </div>
          <button type="submit" class="btn btn-gradient btn-block">Create Account →</button>
        </form>

        <div class="auth-footer">
          <span class="auth-divider">or continue with</span>
          <div class="social-buttons">
            <button class="social-btn" type="button" disabled title="Not wired up — no backend support yet">Google</button>
            <button class="social-btn" type="button" disabled title="Not wired up — no backend support yet">GitHub</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
